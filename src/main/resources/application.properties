# Spring Boot Application Configuration
spring.application.name=wallet-service

# DataSource Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/wallets
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent-output=false

# Logging Configuration
logging.level.root=INFO
logging.level.com.paytm.wallet=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
logging.pattern.console=%d{ISO8601} %p %c{1.} %m%n
logging.file.name=logs/wallet-service.log
logging.file.max-size=10MB
logging.file.max-history=10

# Management/Actuator Configuration
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoints.web.base-path=/
management.endpoint.health.show-details=always
management.endpoint.metrics.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=50ms,100ms,200ms,500ms,1s,2s

# Server Configuration
server.port=8080
server.servlet.context-path=/
server.shutdown=graceful
server.compression.enabled=true
server.compression.min-response-size=1024
